name: Probe BD export (temporaire)
on:
  push:
    branches: ["claude/project-thread-40i5jv"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: |
          pip install -r requirements.txt
          python scripts/export_bd.py --out /tmp/bd.json
          python -c "import json;d=json.load(open('/tmp/bd.json'));[print(x['score'],x['tier'],x['title'],x['hcRating'],x['votes'],bool(x['cover']),x['genres'],x['overview'][:60].replace(chr(10),' ')) for x in d['bd']]"
