name: TMP test export_games
on:
  push:
    branches: ["claude/project-thread-fpu3te"]
    paths: ["scripts/export_games.py", ".github/workflows/tmp-test-games.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Export (Steam 3 min)
        env:
          GAMEPASS_MARKET: PL
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/export_games.py --out /tmp/games.json --steam-budget 3
      - name: Summary
        run: |
          python - <<'PY'
          import json, collections
          d = json.load(open('/tmp/games.json'))
          g = d['games']
          print('count', len(g), 'market', d['market'])
          print('tiers', collections.Counter(x['tier'] for x in g))
          print('scoreSrc', collections.Counter(x['scoreSrc'] for x in g))
          print('with cover', sum(1 for x in g if x['cover']), 'genres', collections.Counter(z for x in g for z in x['genres']).most_common(20))
          print('leaving', [x['title'] for x in g if x['leaving']])
          for x in g[:12]:
              print(json.dumps({k: x[k] for k in ('id','title','en','tier','year','score','scoreSrc','steam','votes','xboxRating','xboxVotes','genres','cover')}, ensure_ascii=False))
          steam = [x for x in g if x['steam'].get('at')]
          print('steam tried', len(steam), 'found', sum(1 for x in steam if x['steam'].get('appid')))
          print('steam misses', [x['en'] or x['title'] for x in steam if not x['steam'].get('appid')][:60])
          print('steam hits', [(x['en'] or x['title'], x['steam']['appid']) for x in steam if x['steam'].get('appid')][:60])
          print('size KB', len(open('/tmp/games.json').read())/1024)
          PY
