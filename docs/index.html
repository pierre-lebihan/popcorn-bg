<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Popcorn BG" />
  <title>Popcorn BG — Top Films &amp; Séries IMDb</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%23111520'/%3E%3Ctext x='64' y='88' font-size='74' text-anchor='middle'%3E%F0%9F%8D%BF%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%23111520'/%3E%3Ctext x='64' y='88' font-size='74' text-anchor='middle'%3E%F0%9F%8D%BF%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #090b10;
      --bg-elev: #111520;
      --bg-card: #151a27;
      --bg-card-hover: #1b2233;
      --bg-chip: #1b2130;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --text-muted: #64748b;
      --gold: #f5c518;
      --gold-bg: rgba(245, 197, 24, 0.14);
      --accent: #38bdf8;
      --accent-bg: rgba(56, 189, 248, 0.15);
      --green: #34d399;
      --green-bg: rgba(52, 211, 153, 0.14);
      --amber: #fb923c;
      --amber-bg: rgba(251, 146, 60, 0.15);
      --netflix: #ff3b47;
      --netflix-bg: rgba(229, 9, 20, 0.18);
      --prime: #38bdf8;
      --prime-bg: rgba(0, 168, 225, 0.18);
      --apple: #e2e8f0;
      --apple-bg: rgba(226, 232, 240, 0.14);
      --radius: 14px;
      --radius-sm: 9px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      overscroll-behavior-y: none;
    }

    body.modal-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, select, input {
      font: inherit;
      color: inherit;
    }

    /* Sticky Top Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(9, 11, 16, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding-top: var(--safe-top);
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 8px 12px 9px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      transition: max-height 0.18s ease, opacity 0.15s ease, margin-bottom 0.18s ease;
      max-height: 54px;
    }

    @media (max-width: 719px) {
      body.is-scrolled:not(.adv-open) .brand-row {
        max-height: 0;
        opacity: 0;
        margin-bottom: 0;
        overflow: hidden;
        pointer-events: none;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-icon {
      font-size: 22px;
      line-height: 1;
    }

    .brand-titles {
      min-width: 0;
    }

    .brand-title {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-random {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(245, 197, 24, 0.18), rgba(251, 146, 60, 0.18));
      border: 1px solid rgba(245, 197, 24, 0.35);
      color: #fde68a;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn-random:active {
      transform: scale(0.96);
    }

    /* Segmented Tabs */
    .tabs {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      gap: 4px;
      background: var(--bg-elev);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 1 0 auto;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-dim);
      padding: 6.5px 3px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .show-sm {
      display: none;
    }

    @media (max-width: 540px) {
      .hide-sm {
        display: none;
      }
      .show-sm {
        display: inline;
      }
      .tab-btn {
        font-size: 11.5px;
        gap: 3px;
        padding: 6px 2px;
      }
    }

    .tab-btn.active {
      background: #1f273a;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .tab-badge {
      font-size: 10px;
      padding: 1px 4.5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-dim);
      font-weight: 700;
      flex-shrink: 0;
    }

    .tab-btn.active .tab-badge {
      background: var(--accent-bg);
      color: var(--accent);
    }

    .tab-badge.alert {
      background: var(--amber-bg);
      color: var(--amber);
    }

    /* Search & Filter Toolbar */
    .toolbar {
      margin-top: 7px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .search-row {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 8px 34px 8px 33px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 12px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .search-clear.visible {
      display: inline-flex;
    }

    .btn-filter-toggle {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-elev);
      color: var(--text);
      padding: 8px 11px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .btn-filter-toggle.active {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
    }

    /* Quick Filter Rows & Scrollable / Wrapped Containers */
    .quick-bars {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .chip-scroll {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 3px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      user-select: none;
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    /* Sur mobile : repli multi-lignes automatique pour voir tous les filtres / saisons d'un coup */
    @media (max-width: 719px) {
      .chip-scroll.chip-mobile-wrap {
        flex-wrap: wrap;
        overflow-x: visible;
        padding-bottom: 0;
      }
    }

    /* Mobile / tactile : masquage de la barre de défilement native */
    @media (hover: none) {
      .chip-scroll {
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding-bottom: 2px;
      }
      .chip-scroll::-webkit-scrollbar {
        display: none;
      }
      .scroll-arrows {
        display: none !important;
      }
    }

    /* En mode PC (souris / curseur fin) : curseur grab, drag slide et barre fluide */
    @media (hover: hover) and (pointer: fine) {
      .chip-scroll {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
        cursor: grab;
      }
      .chip-scroll.is-dragging {
        cursor: grabbing !important;
        scroll-behavior: auto;
      }
      .chip-scroll::-webkit-scrollbar {
        height: 6px;
      }
      .chip-scroll::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 999px;
      }
      .chip-scroll::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.25);
        border-radius: 999px;
      }
      .chip-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.45);
      }
    }

    .scroll-arrows {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }

    .btn-scroll-arrow {
      appearance: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-strong);
      color: var(--text-dim);
      width: 24px;
      height: 22px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
      user-select: none;
    }

    .btn-scroll-arrow:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
    }

    .btn-scroll-arrow:active {
      transform: scale(0.92);
    }

    .chip-sep {
      width: 1px;
      height: 18px;
      background: var(--border-strong);
      flex-shrink: 0;
      margin: 0 2px;
    }

    .chip {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-chip);
      color: var(--text-dim);
      padding: 5px 10.5px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.14s ease;
    }

    .chip.active {
      background: var(--text);
      color: #090b10;
      border-color: var(--text);
    }

    .chip.active-pill {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.45);
      color: #bae6fd;
    }

    .chip.more-filters {
      background: rgba(255, 255, 255, 0.05);
      border-style: dashed;
      border-color: var(--border-strong);
      color: var(--text);
    }

    .chip.prov-netflix.active {
      background: #e50914;
      border-color: #ff3b47;
      color: #fff;
    }

    .chip.prov-prime.active {
      background: #0092c7;
      border-color: #38bdf8;
      color: #fff;
    }

    .chip.prov-apple.active {
      background: #e2e8f0;
      border-color: #fff;
      color: #090b10;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-netflix { background: var(--netflix); }
    .dot-prime { background: var(--prime); }
    .dot-apple { background: var(--apple); }

    /* Expandable Advanced Filters (All filters visible at once) */
    .adv-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 35;
      background: rgba(3, 5, 9, 0.62);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    .adv-backdrop.open {
      display: block;
    }

    .adv-panel {
      display: none;
      background: #121724;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 12px 12px 0;
      margin-top: 2px;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100dvh - 140px);
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.6);
    }

    .adv-panel.open {
      display: flex;
    }

    .adv-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .adv-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .adv-footer {
      position: sticky;
      bottom: 0;
      background: rgba(18, 23, 36, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 10px 0 11px;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-adv-apply {
      appearance: none;
      border: none;
      background: var(--accent);
      color: #06131f;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      margin-left: auto;
    }

    .btn-reset {
      appearance: none;
      border: none;
      background: none;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
    }

    /* Main Content Container */
    .main-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 14px calc(36px + var(--safe-bottom));
    }

    .results-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* Catchup Banner on Series tab */
    .catchup-banner {
      background: linear-gradient(135deg, rgba(251, 146, 60, 0.14), rgba(56, 189, 248, 0.1));
      border: 1px solid rgba(251, 146, 60, 0.32);
      border-radius: var(--radius);
      padding: 11px 13px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .catchup-banner-text {
      font-size: 13px;
      color: #fed7aa;
    }

    .catchup-banner-text strong {
      color: #fff;
    }

    .catchup-banner-arrow {
      font-size: 13px;
      font-weight: 700;
      color: var(--amber);
      white-space: nowrap;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 720px) {
      .cards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .tab-btn {
        font-size: 13.5px;
        padding: 8px 10px;
      }
    }

    .media-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      gap: 12px;
      cursor: pointer;
      position: relative;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .media-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
    }

    .media-card:active {
      transform: scale(0.99);
    }

    .media-card.is-vu {
      opacity: 0.78;
    }

    .poster-wrap {
      position: relative;
      width: 84px;
      min-width: 84px;
      height: 126px;
      border-radius: 9px;
      overflow: hidden;
      background: #0d1018;
      border: 1px solid rgba(255, 255, 255, 0.06);
      align-self: flex-start;
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .poster-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: var(--text-muted);
      background: linear-gradient(160deg, #161c2d, #0d111a);
    }

    .rank-badge {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(9, 11, 16, 0.86);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .status-corner {
      position: absolute;
      bottom: 5px;
      left: 5px;
      right: 5px;
      text-align: center;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 5px;
      backdrop-filter: blur(4px);
    }

    .status-corner.vu {
      background: rgba(16, 185, 129, 0.88);
      color: #042f2e;
    }

    .status-corner.catchup {
      background: rgba(251, 146, 60, 0.92);
      color: #271001;
    }

    .status-corner.locked {
      background: rgba(100, 116, 139, 0.9);
      color: #f8fafc;
    }

    .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .card-title-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card-title {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.25;
      color: var(--text);
    }

    .card-year {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .card-orig {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: -3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scores-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge-imdb {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--gold-bg);
      color: var(--gold);
      border: 1px solid rgba(245, 197, 24, 0.3);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .badge-imdb .votes {
      font-weight: 500;
      font-size: 11px;
      color: #fde68a;
      opacity: 0.85;
    }

    .badge-tmdb {
      font-size: 11.5px;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 6px;
    }

    .meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .prov-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 1.5px 6px;
      border-radius: 5px;
    }
    .prov-pill.netflix { background: var(--netflix-bg); color: #ff6b74; }
    .prov-pill.prime { background: var(--prime-bg); color: #5ccbf7; }
    .prov-pill.apple { background: var(--apple-bg); color: #e2e8f0; }

    .genre-pill {
      font-size: 11px;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.05);
      padding: 1.5px 6px;
      border-radius: 5px;
    }

    .card-overview {
      font-size: 12.5px;
      color: var(--text-dim);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.38;
    }

    .seasons-mini {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }

    .s-pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 1.5px 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-dim);
      border: 1px solid transparent;
    }

    .s-pill.watched {
      background: rgba(52, 211, 153, 0.11);
      color: #6ee7b7;
      border-color: rgba(52, 211, 153, 0.22);
    }

    .s-pill.todo {
      background: rgba(251, 146, 60, 0.14);
      color: #fdba74;
      border-color: rgba(251, 146, 60, 0.3);
    }

    .s-pill.high {
      border-color: rgba(245, 197, 24, 0.32);
      color: #fde68a;
    }

    .btn-load-more {
      display: block;
      width: 100%;
      max-width: 360px;
      margin: 18px auto 6px;
      padding: 11px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: var(--bg-elev);
      color: var(--text);
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
    }

    /* Catchup Tab Dedicated Cards */
    .catchup-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .catchup-card {
      background: var(--bg-card);
      border: 1px solid rgba(251, 146, 60, 0.28);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .catchup-top {
      display: flex;
      gap: 13px;
      cursor: pointer;
    }

    .catchup-eps-box {
      background: rgba(9, 11, 16, 0.55);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
    }

    .catchup-eps-title {
      font-size: 12px;
      font-weight: 700;
      color: #fed7aa;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Episodes Explorer Tab & Modal Episode List */
    .ep-selector-box {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ep-select-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .series-select {
      flex: 1;
      min-width: 210px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .ep-show-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .ep-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ep-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      transition: background 0.12s ease;
    }

    .ep-row:hover {
      background: var(--bg-card-hover);
    }

    .ep-row.ep-watched {
      opacity: 0.62;
    }

    .ep-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .ep-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    .ep-name {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ep-right {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .ep-score {
      font-size: 12.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .ep-score.tier-fire { background: rgba(245, 197, 24, 0.18); color: #fde047; border: 1px solid rgba(245, 197, 24, 0.35); }
    .ep-score.tier-good { background: rgba(52, 211, 153, 0.14); color: #6ee7b7; }
    .ep-score.tier-ok   { background: rgba(56, 189, 248, 0.12); color: #93c5fd; }
    .ep-score.tier-meh  { background: rgba(148, 163, 184, 0.14); color: #cbd5e1; }
    .ep-score.tier-low  { background: rgba(248, 113, 113, 0.15); color: #fca5a5; }

    .ep-votes {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 34px;
      text-align: right;
    }

    /* Empty & Loading States */
    .empty-state {
      text-align: center;
      padding: 44px 18px;
      color: var(--text-dim);
      background: var(--bg-elev);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
    }

    .empty-state .emoji {
      font-size: 34px;
      margin-bottom: 8px;
    }

    /* Modal / Bottom Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(3, 5, 9, 0.76);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 680px;
      max-height: 90dvh;
      background: #121724;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border: 1px solid var(--border-strong);
      overflow-y: auto;
      padding: 14px 16px calc(22px + var(--safe-bottom));
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.65);
      animation: slideUp 0.18s ease-out;
    }

    @media (min-width: 720px) {
      .modal-backdrop {
        align-items: center;
        padding: 20px;
      }
      .modal-sheet {
        border-radius: 20px;
        max-height: 86vh;
        padding: 20px 22px 24px;
      }
    }

    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0.5; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 auto 12px;
    }

    @media (min-width: 720px) {
      .sheet-handle { display: none; }
    }

    .random-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(135deg, rgba(245, 197, 24, 0.16), rgba(251, 146, 60, 0.14));
      border: 1px solid rgba(245, 197, 24, 0.35);
      padding: 8px 12px;
      border-radius: 11px;
      margin-bottom: 12px;
      font-size: 12.5px;
      color: #fde68a;
    }

    .sheet-top {
      display: flex;
      gap: 14px;
      position: relative;
    }

    .sheet-poster {
      width: 104px;
      min-width: 104px;
      height: 156px;
      border-radius: 11px;
      overflow: hidden;
      background: #0d1018;
      border: 1px solid var(--border);
    }

    .sheet-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sheet-close {
      position: absolute;
      top: 0;
      right: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-info {
      flex: 1;
      min-width: 0;
      padding-right: 34px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.22;
    }

    .sheet-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-action {
      flex: 1;
      min-width: 120px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 13px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 700;
      border: 1px solid var(--border-strong);
      background: var(--bg-elev);
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }

    .btn-action.primary {
      background: var(--text);
      color: #090b10;
      border-color: var(--text);
    }

    .btn-action.imdb {
      background: var(--gold-bg);
      color: var(--gold);
      border-color: rgba(245, 197, 24, 0.35);
    }

    .sheet-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .sheet-section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sheet-overview {
      font-size: 14px;
      line-height: 1.55;
      color: #cbd5e1;
      margin: 0;
    }

    /* Household / account */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-account {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-elev);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-account.logged {
      border-color: rgba(52, 211, 153, 0.4);
      background: rgba(52, 211, 153, 0.12);
      color: #a7f3d0;
    }

    .btn-reload {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-elev);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 999px;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    body.is-reloading .btn-reload { animation: spin 0.8s linear infinite; }

    .ptr-indicator {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translate(-50%, 0);
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: var(--bg-elev);
      border: 1px solid var(--border-strong);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      opacity: 0;
      z-index: 200;
      pointer-events: none;
      transition: opacity 0.15s;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    body.is-reloading .ptr-indicator {
      opacity: 1 !important;
      transform: translate(-50%, 30px) !important;
      animation: spin 0.8s linear infinite;
    }
    body.is-reloading .ptr-indicator::after { content: ""; }

    @media (max-width: 380px) {
      .hide-xs { display: none; }
    }

    .who-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .who-pill {
      font-size: 10.5px;
      font-weight: 700;
      padding: 1.5px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-dim);
      white-space: nowrap;
    }

    .who-pill.watched { background: rgba(52, 211, 153, 0.13); color: #6ee7b7; }
    .who-pill.catchup { background: rgba(251, 146, 60, 0.15); color: #fdba74; }
    .who-pill.locked  { background: rgba(100, 116, 139, 0.25); color: #cbd5e1; }

    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-toggle {
      appearance: none;
      flex: 1;
      min-width: 130px;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid var(--border-strong);
      background: var(--bg-elev);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-toggle.on {
      background: rgba(52, 211, 153, 0.16);
      border-color: rgba(52, 211, 153, 0.45);
      color: #a7f3d0;
    }

    .btn-toggle.warn {
      background: rgba(100, 116, 139, 0.18);
    }

    .btn-toggle.warn.on {
      background: rgba(148, 163, 184, 0.28);
      border-color: rgba(148, 163, 184, 0.6);
      color: #f1f5f9;
    }

    .kind-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 1.5px 6px;
      border-radius: 5px;
      background: var(--accent-bg);
      color: #7dd3fc;
    }
    .kind-pill.webtoon { background: rgba(52, 211, 153, 0.14); color: #6ee7b7; }
    .kind-pill.bd { background: rgba(251, 191, 36, 0.14); color: #fcd34d; }
    .kind-pill.comics { background: rgba(248, 113, 113, 0.14); color: #fca5a5; }

    .tier-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
    }
    .tier-pill.chef { background: rgba(245, 197, 24, 0.18); color: #fde68a; }
    .tier-pill.incontournable { background: rgba(56, 189, 248, 0.14); color: #7dd3fc; }

    /* Jeux Game Pass : offre minimum qui inclut le jeu */
    .gp-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 1.5px 6px;
      border-radius: 5px;
    }
    .gp-pill.essential { background: rgba(74, 222, 128, 0.14); color: #86efac; }
    .gp-pill.premium { background: rgba(56, 189, 248, 0.14); color: #7dd3fc; }
    .gp-pill.ultimate { background: rgba(245, 197, 24, 0.18); color: #fde68a; }
    .chip.gp-chip.essential.active { background: #16a34a; border-color: #4ade80; color: #fff; }
    .chip.gp-chip.premium.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    .chip.gp-chip.ultimate.active { background: #ca8a04; border-color: #facc15; color: #fff; }
    .gp-pill.buy { background: rgba(248, 113, 113, 0.14); color: #fca5a5; }
    .gp-pill.free { background: rgba(167, 139, 250, 0.16); color: #c4b5fd; }
    .chip.gp-chip.buy.active { background: #dc2626; border-color: #f87171; color: #fff; }
    .chip.gp-chip.free.active { background: #7c3aed; border-color: #a78bfa; color: #fff; }
    .genre-pill.warn-pill { background: rgba(248, 113, 113, 0.14); color: #fca5a5; }
    .genre-pill.new-pill { background: rgba(167, 139, 250, 0.16); color: #c4b5fd; }

    .cite-line {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.35;
    }

    .ref-banner {
      font-size: 12.5px;
      color: var(--text-dim);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      margin-bottom: 10px;
      cursor: pointer;
      line-height: 1.4;
    }
    .ref-banner strong { color: var(--text); }
    .ref-more { color: #7dd3fc; white-space: nowrap; }

    .cite-list {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
    }
    .cite-list a { color: #7dd3fc; text-decoration: none; }
    .cite-pts { color: #fde68a; font-weight: 700; font-size: 12px; }

    .album-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 320px;
      overflow-y: auto;
    }
    .album-row {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .album-row.on { color: var(--text); border-color: rgba(52, 211, 153, 0.4); }
    .album-num { color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 18px; }

    .tome-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .tome-input {
      width: 76px;
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid var(--border-strong);
      background: var(--bg-elev);
      color: var(--text);
      font-size: 14px;
    }

    .btn-toggle:disabled, .ep-check:disabled, .chip:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .season-toggle {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-chip);
      color: var(--text-dim);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      min-width: 58px;
      flex-shrink: 0;
    }

    .season-toggle small {
      font-size: 10px;
      font-weight: 600;
      opacity: 0.85;
    }

    .season-toggle.on {
      background: rgba(52, 211, 153, 0.16);
      border-color: rgba(52, 211, 153, 0.45);
      color: #a7f3d0;
    }

    .season-toggle.partial {
      border-color: rgba(251, 146, 60, 0.45);
      color: #fdba74;
    }

    .ep-check {
      appearance: none;
      width: 26px;
      height: 26px;
      min-width: 26px;
      border-radius: 8px;
      border: 1.5px solid var(--border-strong);
      background: transparent;
      color: transparent;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .ep-check.on {
      background: #10b981;
      border-color: #10b981;
      color: #04261b;
    }

    .ep-link {
      color: var(--text-muted);
      font-size: 13px;
      padding: 2px 4px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + var(--safe-bottom));
      transform: translateX(-50%);
      background: #1f273a;
      color: var(--text);
      border: 1px solid var(--border-strong);
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      max-width: 92vw;
      text-align: center;
    }

    .toast.error { border-color: rgba(248, 113, 113, 0.5); color: #fecaca; }

    .login-hint {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(52, 211, 153, 0.1));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: var(--radius);
      padding: 11px 13px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #bae6fd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-icon">🍿</span>
          <div class="brand-titles">
            <div class="brand-title">Popcorn BG</div>
            <div class="brand-sub" id="headerSub">Chargement de la liste…</div>
          </div>
        </div>
        <div class="header-actions">
          <button type="button" class="btn-random" id="btnRandom" title="Tirer un titre au sort parmi les filtres actifs">
            🎲<span class="hide-xs"> Au hasard</span>
          </button>
          <button type="button" class="btn-reload" id="btnReload" title="Recharger le catalogue et resynchroniser les vus" aria-label="Recharger">↻</button>
          <button type="button" class="btn-account" id="btnAccount">🔑 Connexion</button>
        </div>
      </div>

      <nav class="tabs" id="mainTabs" aria-label="Sections">
        <button type="button" class="tab-btn active" data-tab="movies">
          🎬 Films <span class="tab-badge" id="badgeMovies">–</span>
        </button>
        <button type="button" class="tab-btn" data-tab="series">
          📺 Séries <span class="tab-badge" id="badgeSeries">–</span>
        </button>
        <button type="button" class="tab-btn" data-tab="catchup">
          🔄 <span class="hide-sm">À rattraper</span><span class="show-sm">En cours</span> <span class="tab-badge alert" id="badgeCatchup">–</span>
        </button>
        <button type="button" class="tab-btn" data-tab="episodes">
          🎯 Épisodes
        </button>
        <button type="button" class="tab-btn" data-tab="reading">
          📚 Lecture <span class="tab-badge" id="badgeReading">–</span>
        </button>
        <button type="button" class="tab-btn" data-tab="games">
          🎮 Jeux <span class="tab-badge" id="badgeGames">–</span>
        </button>
      </nav>

      <div class="toolbar" id="mainToolbar">
        <div class="search-row">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input
              type="search"
              id="searchInput"
              class="search-input"
              placeholder="Titre VF/VO, synopsis, genre, année…"
              autocomplete="off"
              autocorrect="off"
